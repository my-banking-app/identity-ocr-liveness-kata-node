<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity OCR Liveness - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Identity Demo</h1>
        <div id="alert-box" class="alert hidden"></div>
        
        <div id="login-form">
            <h2>Iniciar Sesión</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit">Ingresar</button>
            </form>
            <p style="text-align: center; margin-top: 15px;">
                ¿No tienes cuenta? <a href="#" onclick="toggleForms()">Regístrate</a>
            </p>
        </div>

        <div id="register-form" class="hidden">
            <h2>Registro</h2>
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="reg-name">Nombre</label>
                    <input type="text" id="reg-name" required>
                </div>
                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" required>
                </div>
                <button type="submit">Registrarse</button>
            </form>
            <p style="text-align: center; margin-top: 15px;">
                ¿Ya tienes cuenta? <a href="#" onclick="toggleForms()">Inicia Sesión</a>
            </p>
        </div>
    </div>

    <script src="utils.js"></script>
    <script>
        // Redirect if already logged in
        if (localStorage.getItem('accessToken')) {
            window.location.href = '/dashboard.html';
        }

        function toggleForms() {
            document.getElementById('login-form').classList.toggle('hidden');
            document.getElementById('register-form').classList.toggle('hidden');
            document.getElementById('alert-box').classList.add('hidden');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const data = await Utils.request('/auth/login', 'POST', { email, password });
                Utils.saveAuth(data.accessToken, data.user);
                window.location.href = '/dashboard.html';
            } catch (error) {
                Utils.showError('alert-box', error.message);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            try {
                await Utils.request('/auth/register', 'POST', { name, email, password });
                Utils.showSuccess('alert-box', 'Registro exitoso. Por favor inicia sesión.');
                setTimeout(() => toggleForms(), 1500);
            } catch (error) {
                Utils.showError('alert-box', error.message);
            }
        }
    </script>
</body>
</html>
