name: CI/CD Pipeline – API Gateway

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pipeline:
    uses: my-banking-app/ci-templates/.github/workflows/node-api-ci-cd.yml@v1.1.4
    with:
      service-name:        "Identity OCR Liveness API"
      docker-image-name:   "identity-ocr-liveness-kata-node"
      service-port:        "3000"
      sonar-project-key:   "my-banking-app_identity-ocr-liveness-kata-node"
      node-version:        "20"
      install-command:     "npm ci"
      test-command:        "npm run test:coverage"
    secrets:
      SONAR_TOKEN:        ${{ secrets.SONAR_TOKEN }}
      DOCKER_USERNAME:    ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD:    ${{ secrets.DOCKER_PASSWORD }}
      VPS_HOST:           ${{ secrets.VPS_HOST }}
      VPS_USERNAME:       ${{ secrets.VPS_USERNAME }}
      VPS_PRIVATE_KEY:    ${{ secrets.VPS_PRIVATE_KEY }}
      API_KEY:            ${{ secrets.API_KEY }}
      JWT_SECRET:         ${{ secrets.JWT_SECRET }}
